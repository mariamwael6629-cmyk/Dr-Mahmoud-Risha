name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - claude/simple-desktop-app-kzloh9
    paths:
      - backend/**
      - index.html
      - assets/**
      - .github/workflows/build-exe.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Build Dr-Risha-Clinic.exe
        run: >
          pyinstaller --onefile --noconsole --name "Dr-Risha-Clinic"
          --icon assets/rx-logo.ico
          --paths backend
          --add-data "index.html;."
          --add-data "assets;assets"
          --hidden-import flask_sqlalchemy
          --hidden-import waitress
          --collect-submodules waitress
          --exclude-module flasgger
          backend/desktop_app.py

      - name: Smoke test the exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Dr-Risha-Clinic.exe" -PassThru
          Start-Sleep -Seconds 30
          try {
            $r = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:5000" -TimeoutSec 20
            Write-Host "index status:" $r.StatusCode
            $a = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:5000/api/appointments" -TimeoutSec 20
            Write-Host "api status:" $a.StatusCode
            if ($r.StatusCode -ne 200 -or $a.StatusCode -ne 200) { exit 1 }
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dr-Risha-Clinic-exe
          path: dist/Dr-Risha-Clinic.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: clinic-${{ github.run_number }}
          name: Dr Mahmoud Risha Clinic (build ${{ github.run_number }})
          body: |
            One-click desktop app for the Dr Mahmoud Risha Clinic system.

            Single machine:
            1. Download **Dr-Risha-Clinic.exe** below.
            2. Put it in its own folder on the Desktop and double-click it.
            3. Close the window when finished — everything shuts down cleanly.

            Share data between the doctor's PC and the nurse's PC (same network):
            * Doctor's (main) PC: put **SHARE-ON-NETWORK.txt** next to the .exe,
              then run it. Allow it through the firewall once. Open the created
              **THIS-PC-ADDRESS.txt** to see this PC's address.
            * Nurse's PC: put the .exe and **CONNECT-TO.txt** together, write the
              doctor PC's address inside CONNECT-TO.txt, then run the .exe.

            No Python, no install, no console window.
          files: |
            dist/Dr-Risha-Clinic.exe
            SHARE-ON-NETWORK.txt
            CONNECT-TO.txt
