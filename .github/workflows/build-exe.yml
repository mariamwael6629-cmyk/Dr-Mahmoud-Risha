name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - claude/clinic-management-updates-0l436n
    paths:
      - backend/**
      - index.html
      - assets/**
      - .github/workflows/build-exe.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Build Clinic.exe
        run: >
          pyinstaller --onefile --noconsole --name Clinic
          --paths backend
          --add-data "index.html;."
          --add-data "assets;assets"
          --hidden-import flask_sqlalchemy
          --exclude-module flasgger
          backend/desktop_app.py

      - name: Smoke test the exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Clinic.exe" -PassThru
          Start-Sleep -Seconds 30
          try {
            $r = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:5000" -TimeoutSec 20
            Write-Host "index status:" $r.StatusCode
            $a = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:5000/api/appointments" -TimeoutSec 20
            Write-Host "api status:" $a.StatusCode
            if ($r.StatusCode -ne 200 -or $a.StatusCode -ne 200) { exit 1 }
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clinic-exe
          path: dist/Clinic.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: exe-${{ github.run_number }}
          name: Clinic desktop app (build ${{ github.run_number }})
          files: dist/Clinic.exe
