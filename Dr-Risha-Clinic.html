<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Dr Mahmoud Risha Rheumatology Clinic — Patient Management</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>

:root{
  --accent-light-rgb:59,130,246; --accent-rgb:37,99,235; --accent-dark-rgb:29,78,216; --accent-deep:#1e3a8a;
  --accent:rgb(var(--accent-rgb)); --accent-dark:rgb(var(--accent-dark-rgb));
  --bg-1:#dbeafe; --bg-2:#e0e7ff; --bg-3:#bfdbfe; --bg-4:#c7d2fe;
  --shadow:0 8px 32px rgba(0,30,100,.10);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;min-height:100vh;
  background:linear-gradient(135deg,var(--bg-1) 0%,var(--bg-2) 40%,var(--bg-3) 70%,var(--bg-4) 100%);
  background-attachment:fixed;color:#0f172a;}
body.rtl{font-family:'Cairo',sans-serif;direction:rtl;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 700px 500px at 20% 10%,rgba(var(--accent-light-rgb),.30) 0%,transparent 70%),
             radial-gradient(ellipse 600px 400px at 80% 80%,rgba(var(--accent-dark-rgb),.26) 0%,transparent 70%);}
#app{position:relative;z-index:1;min-height:100vh;}

.navbar{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.6);
  backdrop-filter:blur(20px) saturate(1.4);border-bottom:1px solid rgba(255,255,255,.55);
  box-shadow:0 4px 24px rgba(0,30,100,.08);padding:0 1.5rem;min-height:64px;
  display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;}
.brand{font-family:'Playfair Display',serif;font-size:1.15rem;font-weight:700;
  color:var(--accent-deep);white-space:nowrap;flex-shrink:0;}
body.rtl .brand{font-family:'Cairo',serif;}
.brand span{color:var(--accent);}
.nav-links{display:flex;align-items:center;gap:.2rem;flex:1;justify-content:center;flex-wrap:wrap;}
.nav-btn{display:flex;align-items:center;gap:.35rem;padding:.4rem .85rem;border-radius:10px;
  font-size:.82rem;font-weight:500;cursor:pointer;border:1px solid transparent;
  color:#334155;background:transparent;transition:all .2s;white-space:nowrap;font-family:inherit;}
.nav-btn:hover{background:rgba(var(--accent-rgb),.1);color:var(--accent-dark);border-color:rgba(var(--accent-rgb),.2);}
.nav-btn.active{background:rgba(var(--accent-rgb),.15);color:var(--accent-dark);border-color:rgba(var(--accent-rgb),.3);font-weight:600;}
.nav-btn svg{width:15px;height:15px;flex-shrink:0;}
.nav-right{display:flex;align-items:center;gap:.5rem;margin-inline-start:auto;}
.lang-btn{padding:.36rem .8rem;border-radius:9px;font-size:.78rem;font-weight:700;cursor:pointer;
  border:1.5px solid rgba(var(--accent-rgb),.3);color:var(--accent);background:rgba(var(--accent-rgb),.07);
  transition:all .2s;white-space:nowrap;font-family:inherit;}
.lang-btn:hover{background:rgba(var(--accent-rgb),.14);}
.nav-search{display:flex;align-items:center;gap:.45rem;background:rgba(255,255,255,.7);
  border:1px solid rgba(255,255,255,.8);border-radius:11px;padding:.38rem .85rem;
  min-width:180px;backdrop-filter:blur(8px);}
.nav-search input{border:none;background:transparent;outline:none;font-size:.83rem;
  color:#1e293b;width:100%;font-family:inherit;}
.nav-search input::placeholder{color:#94a3b8;}
.nav-search svg{width:14px;height:14px;color:#94a3b8;flex-shrink:0;}

.glass-card{background:rgba(255,255,255,.58);backdrop-filter:blur(20px) saturate(1.3);
  border:1px solid rgba(255,255,255,.68);border-radius:20px;
  box-shadow:var(--shadow),0 1.5px 0 rgba(255,255,255,.75) inset;}

.page{max-width:1100px;margin:0 auto;padding:2.2rem 1.4rem;animation:fadeUp .32s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.page-heading{font-family:'Playfair Display',serif;font-size:1.9rem;font-weight:700;
  color:var(--accent-deep);margin-bottom:.3rem;}
body.rtl .page-heading{font-family:'Cairo',sans-serif;}
.page-sub{font-size:.88rem;color:#475569;margin-bottom:1.8rem;}

.form-label{display:block;font-size:.77rem;font-weight:600;color:#334155;
  margin-bottom:.32rem;letter-spacing:.03em;text-transform:uppercase;}
body.rtl .form-label{text-transform:none;letter-spacing:0;}
.form-input{width:100%;padding:.62rem .9rem;background:rgba(255,255,255,.75);
  border:1px solid rgba(148,163,184,.33);border-radius:10px;
  font-size:.9rem;font-family:inherit;color:#1e293b;outline:none;transition:all .2s;
  box-shadow:0 1px 3px rgba(0,0,0,.04);}
.form-input:focus{border-color:rgba(var(--accent-rgb),.5);background:rgba(255,255,255,.95);
  box-shadow:0 0 0 3px rgba(var(--accent-rgb),.11),0 1px 3px rgba(0,0,0,.04);}
.form-input::placeholder{color:#94a3b8;}
textarea.form-input{resize:vertical;min-height:80px;}
select.form-input{cursor:pointer;}
.field-group{margin-bottom:1.05rem;}

.form-grid{display:grid;grid-template-columns:1fr;max-width:640px;gap:1.05rem;}

.btn{display:inline-flex;align-items:center;gap:.45rem;padding:.62rem 1.35rem;
  border-radius:10px;font-size:.875rem;font-weight:600;font-family:inherit;
  cursor:pointer;border:none;transition:all .2s;white-space:nowrap;}
.btn-primary{background:linear-gradient(135deg,rgb(var(--accent-light-rgb)),var(--accent));color:#fff;
  box-shadow:0 4px 14px rgba(var(--accent-rgb),.28);}
.btn-primary:hover{background:linear-gradient(135deg,var(--accent),var(--accent-dark));
  box-shadow:0 6px 18px rgba(var(--accent-rgb),.38);transform:translateY(-1px);}
.btn-danger{background:rgba(239,68,68,.1);color:#dc2626;border:1px solid rgba(239,68,68,.25);}
.btn-danger:hover{background:rgba(239,68,68,.18);}
.btn-ghost{background:rgba(148,163,184,.12);color:#475569;border:1px solid rgba(148,163,184,.25);}
.btn-ghost:hover{background:rgba(148,163,184,.2);color:#334155;}
.btn-warning{background:rgba(217,119,6,.1);color:#92400e;border:1px solid rgba(217,119,6,.22);}
.btn-warning:hover{background:rgba(217,119,6,.18);}
.btn-sm{padding:.38rem .85rem;font-size:.79rem;}
.btn svg{width:14px;height:14px;}

.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem;margin-bottom:1.8rem;}
.stat-card{padding:1.15rem 1.4rem;border-radius:16px;}
.stat-card .stat-num{font-family:'Playfair Display',serif;font-size:1.9rem;font-weight:700;color:var(--accent-deep);line-height:1;}
body.rtl .stat-card .stat-num{font-family:'Cairo',sans-serif;}
.stat-card .stat-label{font-size:.74rem;color:#64748b;margin-top:.28rem;font-weight:500;text-transform:uppercase;letter-spacing:.04em;}
body.rtl .stat-card .stat-label{text-transform:none;letter-spacing:0;}

.patient-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:1.15rem;margin-top:1.4rem;}
.patient-card{padding:1.4rem;border-radius:18px;background:rgba(255,255,255,.56);
  border:1px solid rgba(255,255,255,.68);box-shadow:0 4px 20px rgba(0,30,100,.08);
  transition:all .22s;text-align:start;}
.patient-card:hover{background:rgba(255,255,255,.78);box-shadow:0 8px 30px rgba(0,30,100,.13);transform:translateY(-3px);}
.patient-card .avatar{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--bg-3),var(--bg-4));
  display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;
  font-size:1.1rem;font-weight:700;color:var(--accent-deep);margin-bottom:.95rem;}
.patient-card .p-name{font-weight:600;font-size:.93rem;color:#1e293b;margin-bottom:.28rem;}
.patient-card .p-num{font-size:.78rem;color:#64748b;}
.patient-card .p-badge{display:inline-block;margin-top:.65rem;padding:.2rem .62rem;
  border-radius:20px;font-size:.7rem;font-weight:600;background:rgba(var(--accent-rgb),.1);color:var(--accent-dark);}

.section-label{display:flex;align-items:center;gap:.7rem;font-size:.74rem;font-weight:700;
  text-transform:uppercase;letter-spacing:.07em;color:#94a3b8;margin:1.7rem 0 .95rem;}
body.rtl .section-label{text-transform:none;letter-spacing:0;}
.section-label::after{content:'';flex:1;height:1px;background:rgba(148,163,184,.25);}

.appt-block{background:rgba(var(--accent-light-rgb),.12);border:1px solid rgba(var(--accent-light-rgb),.35);
  border-radius:15px;padding:1.4rem;margin-top:.9rem;}
.appt-block .appt-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.1rem;flex-wrap:wrap;gap:.5rem;}
.appt-block .appt-title{font-weight:600;font-size:.88rem;color:var(--accent-deep);display:flex;align-items:center;gap:.4rem;}

.med-table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.875rem;}
thead tr th{background:rgba(var(--accent-rgb),.85);color:#fff;font-weight:600;font-size:.76rem;
  text-transform:uppercase;letter-spacing:.05em;padding:.82rem 1rem;text-align:start;}
body.rtl thead tr th{text-transform:none;letter-spacing:0;}
thead tr th:first-child{border-radius:12px 0 0 0;}
thead tr th:last-child{border-radius:0 12px 0 0;}
body.rtl thead tr th:first-child{border-radius:0 12px 0 0;}
body.rtl thead tr th:last-child{border-radius:12px 0 0 0;}
tbody tr{transition:background .15s;}
tbody tr:hover td{background:rgba(var(--accent-rgb),.05);}
tbody tr td{padding:.78rem 1rem;border-bottom:1px solid rgba(148,163,184,.15);
  color:#334155;background:rgba(255,255,255,.52);vertical-align:middle;}
tbody tr:last-child td:first-child{border-radius:0 0 0 12px;}
tbody tr:last-child td:last-child{border-radius:0 0 12px 0;}
body.rtl tbody tr:last-child td:first-child{border-radius:0 0 12px 0;}
body.rtl tbody tr:last-child td:last-child{border-radius:0 0 0 12px;}

.empty-state{text-align:center;padding:3.5rem 2rem;color:#94a3b8;}
.empty-state svg{width:46px;height:46px;margin:0 auto .9rem;opacity:.38;}
.empty-state p{font-size:.9rem;}

#toast-container{position:fixed;bottom:2rem;right:2rem;z-index:9999;
  display:flex;flex-direction:column;gap:.7rem;pointer-events:none;}
body.rtl #toast-container{right:auto;left:2rem;}
.toast{pointer-events:all;display:flex;align-items:center;gap:.72rem;
  padding:.88rem 1.25rem;border-radius:14px;background:rgba(255,255,255,.93);
  backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.82);
  box-shadow:0 8px 30px rgba(0,0,0,.12);font-size:.875rem;font-weight:500;color:#1e293b;
  animation:slideIn .3s ease,fadeOut .4s ease 2.6s forwards;max-width:330px;}
.toast.success .toast-icon{color:#16a34a;}
.toast.error   .toast-icon{color:#dc2626;}
.toast.info    .toast-icon{color:var(--accent);}
.toast svg{width:17px;height:17px;flex-shrink:0;}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@keyframes fadeOut{from{opacity:1}to{opacity:0;pointer-events:none}}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.25);backdrop-filter:blur(4px);
  z-index:200;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s ease;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.dialog{background:rgba(255,255,255,.93);backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.82);border-radius:20px;padding:2rem;
  max-width:380px;width:92%;box-shadow:0 20px 60px rgba(0,0,0,.14);
  animation:popIn .25s cubic-bezier(.34,1.56,.64,1) both;}
@keyframes popIn{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
.dialog h3{font-weight:700;font-size:1.02rem;color:#1e293b;margin-bottom:.48rem;}
.dialog p{font-size:.875rem;color:#64748b;margin-bottom:1.45rem;}
.dialog .dialog-actions{display:flex;gap:.72rem;justify-content:flex-end;}

.detail-overlay{position:fixed;inset:0;background:rgba(0,0,0,.28);backdrop-filter:blur(5px);
  z-index:200;display:flex;align-items:flex-start;justify-content:center;
  padding:2rem 1rem;overflow-y:auto;animation:fadeIn .2s ease;}
.detail-modal{background:rgba(255,255,255,.94);backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.82);border-radius:22px;padding:2.4rem;
  max-width:700px;width:100%;box-shadow:0 24px 80px rgba(0,0,0,.14);
  animation:popIn .3s cubic-bezier(.34,1.4,.64,1) both;position:relative;}
.detail-modal .close-btn{position:absolute;top:1.1rem;right:1.1rem;background:rgba(0,0,0,.07);
  border:none;border-radius:50%;width:31px;height:31px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:#64748b;transition:all .15s;}
body.rtl .detail-modal .close-btn{right:auto;left:1.1rem;}
.detail-modal .close-btn:hover{background:rgba(0,0,0,.12);}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1.15rem;}
.info-item{padding:.88rem .95rem;background:rgba(241,245,249,.82);border-radius:12px;}
.info-item .info-key{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#94a3b8;margin-bottom:.22rem;}
body.rtl .info-item .info-key{text-transform:none;letter-spacing:0;}
.info-item .info-val{font-size:.9rem;color:#1e293b;font-weight:500;}

.ac-dropdown{position:absolute;display:none;background:rgba(255,255,255,.98);backdrop-filter:blur(16px);
  border:1px solid rgba(203,213,225,.8);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.14);
  max-height:220px;overflow-y:auto;z-index:500;}
.ac-item{padding:.55rem .8rem;font-size:.85rem;color:#1e293b;cursor:pointer;border-bottom:1px solid rgba(241,245,249,.9);}
.ac-item:last-child{border-bottom:none;}
.ac-item:hover,.ac-item.ac-active{background:rgba(219,234,254,.6);}
.ac-item small{display:block;font-size:.72rem;color:#94a3b8;margin-top:.1rem;}

.signin-wrap{min-height:calc(100vh - 64px);display:flex;align-items:center;justify-content:center;padding:2rem 1rem;}
.signin-card{width:100%;max-width:420px;padding:2.4rem;}
.signin-logo{text-align:center;margin-bottom:1.9rem;}
.signin-logo .icon{width:60px;height:60px;background:linear-gradient(135deg,var(--bg-1),var(--bg-3));
  border-radius:18px;display:inline-flex;align-items:center;justify-content:center;
  margin-bottom:.95rem;box-shadow:0 4px 16px rgba(var(--accent-rgb),.2);}
.signin-logo .icon svg{width:29px;height:29px;color:var(--accent);}

#rx-preview{position:relative;width:170mm;height:240mm;margin:0 auto;background:#fdfcfb;
  border-radius:5mm;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 2px 14px rgba(0,0,0,.06);font-family:'Cairo',sans-serif;}
#rx-preview .header{background:#2c1a2e;margin:0 5.6mm;border-radius:0 0 6mm 6mm;
  padding:5mm 6mm 6mm;display:flex;align-items:center;gap:3mm;direction:ltr;}
#rx-preview .header .en-block{flex:1;min-width:0;direction:ltr;text-align:left;color:#fff;}
#rx-preview .header .en-block .dr{font-weight:600;font-size:4.6mm;color:#fcce5b;letter-spacing:.5px;line-height:1.05;}
#rx-preview .header .en-block .name{font-weight:700;font-size:5.6mm;color:#fcce5b;letter-spacing:0;line-height:1.05;margin-bottom:1.6mm;white-space:nowrap;}
#rx-preview .header .en-block .sub1{font-weight:500;font-size:2.55mm;color:#fff;letter-spacing:.3px;line-height:1.35;}
#rx-preview .header .en-block .sub2{font-weight:500;font-size:2.15mm;color:#fff;letter-spacing:.2px;line-height:1.5;margin-top:.6mm;}
#rx-preview .header .logo-badge{flex:0 0 auto;width:33mm;height:41mm;border-radius:7mm;overflow:hidden;background:#fdfcfb;box-shadow:0 1px 4px rgba(0,0,0,.25);}
#rx-preview .header .logo-badge img{width:100%;height:100%;object-fit:cover;display:block;}
#rx-preview .header .ar-block{flex:1;min-width:0;direction:rtl;text-align:right;color:#fff;}
#rx-preview .header .ar-block .doctor{font-weight:800;font-size:6.2mm;color:#fcce5b;line-height:1.05;}
#rx-preview .header .ar-block .name{font-weight:800;font-size:7.6mm;color:#fcce5b;line-height:1.1;margin-bottom:1.2mm;white-space:nowrap;letter-spacing:.5px;}
#rx-preview .header .ar-block .sub{font-weight:700;font-size:2.3mm;color:#fff;line-height:1.55;}

#rx-preview .patientbar{margin:2.4mm 5.6mm 0;border-radius:4mm;
  background:linear-gradient(120deg,#c8862e 0%,#f0c674 22%,#c8862e 48%,#f0c674 74%,#c8862e 100%);
  padding:2.6mm 4mm;}
#rx-preview .pb-row{display:flex;align-items:center;gap:2.2mm;padding:1.4mm 0;}
#rx-preview .pb-row + .pb-row{border-top:1px solid rgba(255,255,255,.35);}
#rx-preview .pb-field{display:flex;align-items:center;gap:1.6mm;}
#rx-preview .pb-field.grow{flex:1;min-width:0;}
#rx-preview .pb-field label{font-weight:800;font-size:2.95mm;color:#fff;white-space:nowrap;text-shadow:0 1px 1px rgba(0,0,0,.15);}
#rx-preview .pb-dots{flex:1;min-width:10mm;height:5mm;background:#fff;border-radius:1.8mm;
  border:1px dashed #b9863a;display:flex;align-items:center;padding:0 1.8mm;overflow:hidden;
  font-weight:600;font-size:2.7mm;color:#241526;white-space:nowrap;text-overflow:ellipsis;}
#rx-preview .pb-field.short .pb-dots{flex:0 0 24mm;}

#rx-preview .body{position:relative;flex:1;background:#fdfcfb;overflow:hidden;padding:9mm 8mm 24mm;direction:rtl;}
#rx-preview .rx-mark{position:absolute;top:5mm;left:6mm;width:15mm;z-index:1;}
#rx-preview .rx-mark img{width:100%;display:block;}
#rx-preview .watermark{position:absolute;top:46%;left:50%;transform:translate(-50%,-50%);width:54%;opacity:.92;pointer-events:none;z-index:0;}
#rx-preview .watermark img{width:100%;display:block;}
#rx-preview .rx-drug-line{position:relative;z-index:1;display:flex;gap:1.6mm;padding:1.6mm 1mm;
  border-bottom:1px dashed rgba(44,26,46,.2);align-items:flex-start;}
#rx-preview .rx-drug-num{font-weight:700;color:#2c1a2e;font-size:3.1mm;min-width:5mm;}
#rx-preview .rx-drug-name{font-weight:700;font-size:3.2mm;color:#1e1320;}
#rx-preview .rx-drug-dose{font-size:2.7mm;color:#475569;margin-top:.4mm;}
#rx-preview .rx-notes-box{position:relative;z-index:1;margin-top:2.6mm;padding:1.8mm 2.6mm;font-size:2.8mm;color:#475569;
  background:rgba(240,198,116,.22);border-radius:2mm;border:1px solid rgba(44,26,46,.12);}
#rx-preview .signature{position:absolute;left:6mm;bottom:6mm;width:46mm;z-index:1;}
#rx-preview .signature img{width:100%;display:block;}
#rx-preview .qr-badge{position:absolute;right:6mm;bottom:6mm;width:24mm;z-index:1;}
#rx-preview .qr-badge img{width:100%;display:block;border-radius:2mm;}

#rx-preview .footer-gold{height:2.6mm;background:linear-gradient(90deg,#c8862e,#f0c674,#dca63c,#f0c674,#c8862e);}
#rx-preview .footer{background:#2c1a2e;padding:3mm 5.6mm 4mm;color:#fff;}
#rx-preview .pills{display:flex;gap:2.2mm;margin-bottom:2.6mm;direction:ltr;}
#rx-preview .pill{background:#fff;color:#241526;border-radius:5mm;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:2.9mm;padding:1.6mm 3mm;}
#rx-preview .pill.date{flex:0 0 26mm;gap:2mm;direction:ltr;}
#rx-preview .pill.info{flex:1;gap:2.4mm;direction:rtl;}
#rx-preview .pill.info .divider{width:1px;height:4mm;background:#241526;opacity:.6;}
#rx-preview .contact-row{display:flex;align-items:center;gap:2mm;margin-top:1.6mm;}
#rx-preview .icon-badge{flex:0 0 auto;width:5mm;height:5mm;border-radius:1.3mm;display:flex;align-items:center;justify-content:center;}
#rx-preview .icon-badge.wa{background:#2fa53e;}
#rx-preview .icon-badge.ph,#rx-preview .icon-badge.pin{background:#fcce5b;}
#rx-preview .icon-badge svg{width:3.1mm;height:3.1mm;}
#rx-preview .phone-num{font-weight:700;font-size:3.6mm;letter-spacing:.3px;direction:ltr;white-space:nowrap;}
#rx-preview .phone-num .accent{color:#fcce5b;}
#rx-preview .address-txt{font-weight:700;font-size:2.55mm;color:#fff;flex:1;text-align:right;}

#rx-preview.rx-overlay-mode{background:transparent;box-shadow:none;}
.rx-overlay-mode .header,.rx-overlay-mode .patientbar,.rx-overlay-mode .footer-gold,.rx-overlay-mode .footer{background:transparent !important;}
.rx-overlay-mode .header .en-block,.rx-overlay-mode .header .ar-block,.rx-overlay-mode .header .logo-badge{visibility:hidden;}
.rx-overlay-mode .pb-field label{visibility:hidden;}
.rx-overlay-mode .pb-dots{background:transparent;border:none;}

let currentLang = 'en';
function t(k){ return LANG[currentLang][k] ?? LANG.en[k] ?? k; }

function esc(v){
  return String(v ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[c]));
}

function toggleLang(){
  currentLang = currentLang === 'en' ? 'ar' : 'en';
  const isAr = currentLang === 'ar';
  document.body.classList.toggle('rtl', isAr);
  document.documentElement.lang = currentLang;
  document.documentElement.dir  = isAr ? 'rtl' : 'ltr';
  document.getElementById('langBtn').textContent = isAr ? 'English' : 'عربي';
  document.getElementById('globalSearch').placeholder = t('searchPh');
  navigate(state.currentPage);
}

const THEME_STORAGE_KEY = 'clinicTheme';

function applyTheme(themeId, opts){
  const theme = THEMES.find(th => th.id === themeId) || THEMES[0];
  const root = document.documentElement.style;
  root.setProperty('--accent-light-rgb', theme.accentLightRgb);
  root.setProperty('--accent-rgb', theme.accentRgb);
  root.setProperty('--accent-dark-rgb', theme.accentDarkRgb);
  root.setProperty('--accent-deep', theme.accentDeep);
  root.setProperty('--bg-1', theme.bg[0]);
  root.setProperty('--bg-2', theme.bg[1]);
  root.setProperty('--bg-3', theme.bg[2]);
  root.setProperty('--bg-4', theme.bg[3]);
  state.activeTheme = theme.id;
  localStorage.setItem(THEME_STORAGE_KEY, theme.id);
  if(opts && opts.rerenderSettings && document.getElementById('page-settings')) renderSettings();
}

function loadDB(){
  try{ const s=localStorage.getItem(DB_KEY); if(s) return JSON.parse(s); }catch(e){}
  const db={ seq:1, patients:[], prescriptions:[], invoices:[], medications:[],
    medLib: OFFLINE_SEED.med.slice(), diagLib: OFFLINE_SEED.diag.slice(),
    labLib: OFFLINE_SEED.lab.slice(), radLib: OFFLINE_SEED.rad.slice(),
    branding: _defaultBranding() };
  try{ localStorage.setItem(DB_KEY, JSON.stringify(db)); }catch(e){}
  return db;
}
let DB = loadDB();
function saveDB(){ try{ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }catch(e){} }
function nextId(){ DB.seq=(DB.seq||1)+1; return DB.seq; }
function clone(x){ return x===undefined?x:JSON.parse(JSON.stringify(x)); }
function apiErr(status,data){ const e=new Error((data&&(data.message||data.error))||('Request failed ('+status+')')); e.status=status; e.data=data||{}; return e; }
function parseQuery(qs){ const o={}; if(!qs) return o; qs.split('&').forEach(kv=>{ if(!kv) return; const i=kv.indexOf('='); const k=decodeURIComponent(i<0?kv:kv.slice(0,i)); const v=i<0?'':decodeURIComponent(kv.slice(i+1)); o[k]=v; }); return o; }
function pad2(n){ return String(n).padStart(2,'0'); }
function isoDate(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function parseISO(s){ const p=String(s||'').split('-').map(Number); return new Date(p[0],(p[1]||1)-1,p[2]||1); }

const OFF_BUSINESS_START=16, OFF_BUSINESS_END=21;
const OFF_VALID_DAYS=new Set([0,2,4]);
const OFF_DUR={consultation:15,followUp:10,procedure:30,other:15};
function durMin(vt){ return OFF_DUR[vt]||15; }
function isValidDay(d){ return OFF_VALID_DAYS.has(d.getDay()); }
function allAppointments(){ const out=[]; DB.patients.forEach(p=>{ (p.appointments||[]).forEach(a=>out.push(a)); }); return out; }
function bookedIntervals(dayStr){
  const res=[];
  allAppointments().forEach(a=>{
    if(!a.time||a.status==='cancelled'||a.date!==dayStr) return;
    const t=a.time.split(':').map(Number); const start=t[0]*60+(t[1]||0);
    res.push([start,start+durMin(a.visitType)]);
  });
  res.sort((x,y)=>x[0]-y[0]); return res;
}
function roundUp5(m){ const r=m%5; return r===0?m:m+(5-r); }
function availableSlots(dateStr,vt){
  if(!dateStr) return [];
  const day=parseISO(dateStr); if(isNaN(day)) return [];
  if(!isValidDay(day)) return [];
  const dur=durMin(vt), startM=OFF_BUSINESS_START*60, endM=OFF_BUSINESS_END*60;
  let cand=startM; const now=new Date();
  if(isoDate(day)===isoDate(now)) cand=Math.max(cand,roundUp5(now.getHours()*60+now.getMinutes()));
  const iv=bookedIntervals(dateStr); const slots=[];
  while(cand+dur<=endM){
    const c=iv.find(x=> cand<x[1] && cand+dur>x[0]);
    if(c){ cand=c[1]; continue; }
    slots.push(pad2(Math.floor(cand/60))+':'+pad2(cand%60)); cand+=dur;
  }
  return slots;
}
function nextAvailableSlot(vt){
  const today=new Date();
  for(let off=0;off<120;off++){ const d=new Date(today); d.setDate(d.getDate()+off);
    if(!isValidDay(d)) continue; const s=availableSlots(isoDate(d),vt); if(s.length) return {date:isoDate(d),time:s[0]}; }
  return {date:null,time:null};
}
function validBookingDays(count){
  const today=new Date(); const days=[]; let off=0;
  while(days.length<(count||8)&&off<120){ const d=new Date(today); d.setDate(d.getDate()+off); if(isValidDay(d)) days.push(isoDate(d)); off++; }
  return days;
}
function resolveSlot(dateStr,timeStr,vt){
  if(dateStr&&timeStr) return {date:dateStr,time:timeStr};
  if(dateStr&&!timeStr){ const s=availableSlots(dateStr,vt); if(s.length) return {date:dateStr,time:s[0]}; }
  return nextAvailableSlot(vt);
}
function nextPatientNumber(){
  let mx=0; DB.patients.forEach(p=>{ const m=/^P-(\d+)$/.exec(p.patientNumber||''); if(m) mx=Math.max(mx,parseInt(m[1])); });
  return 'P-'+String(mx+1).padStart(4,'0');
}
function findPatient(id){ return DB.patients.find(p=>p.id===id); }
function findAppt(id){ let found=null; DB.patients.forEach(p=>{ (p.appointments||[]).forEach(a=>{ if(a.id===id) found=a; }); }); return found; }
function apptOut(a,withPatient){ const o=clone(a); if(withPatient){ const p=findPatient(a.patientId)||{}; o.patientName=p.Name; o.patientNumber=p.patientNumber; o.patientMobile=p.mobileNumber; o.patientAge=p.age; o.patientGender=p.gender; } return o; }
function invoiceOut(inv){ const st=inv.paidAmount<=0?'unpaid':(inv.paidAmount>=inv.amount?'paid':'partial'); const p=findPatient(inv.patientId)||{}; return Object.assign(clone(inv),{status:st,balance:Math.round((inv.amount-inv.paidAmount)*100)/100,patientName:p.Name,patientNumber:p.patientNumber}); }
function findOrCreatePatient(name,mobile){
  if(mobile){ const ex=DB.patients.find(p=>p.mobileNumber===mobile); if(ex) return ex; }
  const p={id:nextId(),patientNumber:nextPatientNumber(),Name:name,age:null,gender:null,previousOperations:null,previousTreatment:null,diagnosis:null,symptoms:null,familyHistory:null,mobileNumber:mobile||null,emergencyContact:null,notes:null,medicalHistoryExtra:{},createdAt:new Date().toISOString(),appointments:[]};
  DB.patients.push(p); return p;
}
function newAppt(patientId,d){
  return {id:nextId(),patientId:patientId,date:d.date||null,time:d.time||null,diagnosis:d.diagnosis||null,drugs:d.drugs||null,requiredTests:d.requiredTests||null,testsResult:d.testsResult||null,medicalXRayRequired:d.medicalXRayRequired||null,medicalXRayResult:d.medicalXRayResult||null,status:d.status||'waiting',visitType:d.visitType||null,visitNotes:d.visitNotes||null,createdAt:new Date().toISOString(),files:[]};
}
function libSearch(list,keyFields,q){ q=(q||'').toLowerCase(); return list.filter(it=>keyFields.some(k=>String(it[k]||'').toLowerCase().includes(q))).slice(0,15); }

async function localApi(method, fullPath, body){
  const qi=fullPath.indexOf('?'); const path=qi<0?fullPath:fullPath.slice(0,qi); const query=parseQuery(qi<0?'':fullPath.slice(qi+1));
  const seg=path.split('/').filter(Boolean);
  body=body||{};
  const today=isoDate(new Date());

  if(path==='/patients' && method==='GET'){
    const search=(query.search||'').toLowerCase().trim();
    let items=DB.patients.slice().sort((a,b)=>b.id-a.id);
    if(search) items=items.filter(p=>(p.Name||'').toLowerCase().includes(search)||String(p.patientNumber||'').toLowerCase().includes(search)||String(p.mobileNumber||'').includes(search));
    return {items:clone(items),total:items.length,page:1,perPage:items.length};
  }
  if(path==='/patients/next-number') return {patientNumber:nextPatientNumber()};
  if(path==='/patients/duplicate-check'){ const dup=DB.patients.find(p=>p.mobileNumber===(query.mobileNumber||'')); return {duplicate:!!dup,patient:dup?clone(dup):null}; }
  if(path==='/patients' && method==='POST'){
    const mobile=body.mobileNumber;
    if(mobile && !body.forceCreateDuplicate){ const dup=DB.patients.find(p=>p.mobileNumber===mobile); if(dup) throw apiErr(409,{error:'duplicate_mobile',message:'A patient with this mobile number already exists.',existingPatient:clone(dup)}); }
    const p={id:nextId(),patientNumber:nextPatientNumber(),Name:body.Name,age:body.age,gender:body.gender,previousOperations:body.previousOperations,previousTreatment:body.previousTreatment,diagnosis:body.diagnosis,symptoms:body.symptoms,familyHistory:body.familyHistory,mobileNumber:mobile,emergencyContact:body.emergencyContact,notes:body.notes,medicalHistoryExtra:body.medicalHistoryExtra||{},createdAt:new Date().toISOString(),appointments:[]};
    (body.appointments||[]).forEach(a=>p.appointments.push(newAppt(p.id,a)));
    DB.patients.push(p); saveDB(); return clone(p);
  }
  if(seg[0]==='patients' && seg.length===2 && method==='GET'){ const p=findPatient(parseInt(seg[1])); if(!p) throw apiErr(404,{error:'Patient not found'}); return clone(p); }
  if(seg[0]==='patients' && seg.length===2 && method==='PUT'){
    const p=findPatient(parseInt(seg[1])); if(!p) throw apiErr(404,{error:'Patient not found'});
    if('mobileNumber' in body){ const dup=DB.patients.find(x=>x.mobileNumber===body.mobileNumber&&x.id!==p.id); if(dup) throw apiErr(409,{error:'duplicate_mobile',message:'A patient with this mobile number already exists.',existingPatient:clone(dup)}); }
    ['Name','age','gender','previousOperations','previousTreatment','diagnosis','symptoms','familyHistory','mobileNumber','emergencyContact','notes'].forEach(k=>{ if(k in body) p[k]=body[k]; });
    if('medicalHistoryExtra' in body) p.medicalHistoryExtra=body.medicalHistoryExtra||{};
    saveDB(); return clone(p);
  }
  if(seg[0]==='patients' && seg.length===2 && method==='DELETE'){ const i=DB.patients.findIndex(p=>p.id===parseInt(seg[1])); if(i<0) throw apiErr(404,{error:'Patient not found'}); DB.patients.splice(i,1); saveDB(); return {success:true}; }
  if(seg[0]==='patients' && seg[2]==='prescriptions' && method==='GET'){ const pid=parseInt(seg[1]); return clone(DB.prescriptions.filter(r=>r.patientId===pid).sort((a,b)=>b.id-a.id)); }
  if(seg[0]==='patients' && seg[2]==='appointments' && method==='POST'){ const p=findPatient(parseInt(seg[1])); if(!p) throw apiErr(404,{error:'Patient not found'}); const a=newAppt(p.id,body); p.appointments.push(a); saveDB(); return clone(a); }

  if(path==='/appointments/book' && method==='POST'){
    const name=(body.name||'').trim(); if(!name) throw apiErr(400,{error:'A patient name is required.'});
    const vt=body.visitType||'consultation'; const nearest=!!body.nearest;
    const r=resolveSlot(nearest?null:(body.date||null), nearest?null:(body.time||null), vt);
    if(!r.date||!r.time) throw apiErr(400,{error:'No available slot could be found.'});
    const p=findOrCreatePatient(name,(body.mobileNumber||'').trim());
    const a=newAppt(p.id,{date:r.date,time:r.time,visitType:vt,status:'waiting'}); p.appointments.push(a); saveDB();
    const out=apptOut(a,true); out.patient=clone(p); return out;
  }
  if(path==='/appointments/slots') return {date:query.date||null,slots:availableSlots(query.date,query.visitType),validDays:validBookingDays(8)};
  if(path==='/appointments/next-slot') return nextAvailableSlot(query.visitType);
  if(path==='/appointments' && method==='GET'){
    let list=allAppointments();
    if(query.date) list=list.filter(a=>a.date===query.date);
    if(query.status) list=list.filter(a=>a.status===query.status);
    if(query.patientId) list=list.filter(a=>a.patientId===parseInt(query.patientId));
    list=list.slice().sort((a,b)=> String(b.date||'').localeCompare(String(a.date||'')) || String(a.time||'').localeCompare(String(b.time||'')) || a.id-b.id);
    return list.map(a=>apptOut(a,true));
  }
  if(seg[0]==='appointments' && seg.length===2 && method==='PUT'){ const a=findAppt(parseInt(seg[1])); if(!a) throw apiErr(404,{error:'Appointment not found'}); ['date','time','diagnosis','drugs','requiredTests','testsResult','medicalXRayRequired','medicalXRayResult','status','visitType','visitNotes'].forEach(k=>{ if(k in body) a[k]=body[k]; }); saveDB(); return apptOut(a,false); }
  if(seg[0]==='appointments' && seg.length===2 && method==='DELETE'){ let done=false; DB.patients.forEach(p=>{ const i=(p.appointments||[]).findIndex(a=>a.id===parseInt(seg[1])); if(i>=0){ p.appointments.splice(i,1); done=true; } }); if(!done) throw apiErr(404,{error:'Appointment not found'}); saveDB(); return {success:true}; }

  if(path==='/diagnosis/search') return libSearch(DB.diagLib,['diagnosis','code','specialty'],query.q);
  if(path==='/medications/search') return libSearch(DB.medLib,['drugName','genericName','category'],query.q);
  if(path==='/lab-tests/search') return libSearch(DB.labLib,['testName','code','category'],query.q);
  if(path==='/radiology/search') return libSearch(DB.radLib,['examName','code','category'],query.q);

  if(path==='/medications' && method==='GET') return clone(DB.medications.slice().sort((a,b)=>b.id-a.id));
  if(path==='/medications' && method==='POST'){ const r={id:nextId(),name:body.name,company:body.company,purpose:body.purpose,date:new Date().toISOString().split('T')[0],genericName:body.genericName,category:body.category,dosage:body.dosage}; DB.medications.push(r); saveDB(); return clone(r); }
  if(seg[0]==='medications' && seg.length===2 && method==='DELETE'){ const i=DB.medications.findIndex(m=>m.id===parseInt(seg[1])); if(i>=0){ DB.medications.splice(i,1); saveDB(); } return {success:true}; }
  if(path==='/medications/library' && method==='POST'){ if(body.drugName && !DB.medLib.some(m=>(m.drugName||'').toLowerCase()===body.drugName.toLowerCase())){ DB.medLib.push({drugName:body.drugName,genericName:body.genericName||null,dosage:body.dosage||null,category:body.category||null,notes:body.notes||null}); saveDB(); } return {success:true}; }

  if(path==='/prescriptions' && method==='POST'){ const r={id:nextId(),patientId:body.patientId,date:body.date||today,diagnosis:body.diagnosis||null,notes:body.notes||null,drugs:body.drugs||[],createdAt:new Date().toISOString()}; DB.prescriptions.push(r); saveDB(); return clone(r); }

  if(path==='/financial/invoices' && method==='GET'){ let list=DB.invoices.slice(); if(query.patientId) list=list.filter(i=>i.patientId===parseInt(query.patientId)); let out=list.map(invoiceOut); if(query.status) out=out.filter(i=>i.status===query.status); return out; }
  if(path==='/financial/invoices' && method==='POST'){ const inv={id:nextId(),patientId:parseInt(body.patientId),appointmentId:body.appointmentId?parseInt(body.appointmentId):null,description:body.description||null,amount:Number(body.amount)||0,paidAmount:Number(body.paidAmount)||0,date:body.date||today}; DB.invoices.push(inv); saveDB(); return invoiceOut(inv); }
  if(seg[0]==='financial' && seg[1]==='invoices' && seg[3]==='payments' && method==='POST'){ const inv=DB.invoices.find(i=>i.id===parseInt(seg[2])); if(!inv) throw apiErr(404,{error:'Not found'}); inv.paidAmount=(Number(inv.paidAmount)||0)+(Number(body.amount)||0); saveDB(); return invoiceOut(inv); }
  if(seg[0]==='financial' && seg[1]==='invoices' && seg.length===3 && method==='PUT'){ const inv=DB.invoices.find(i=>i.id===parseInt(seg[2])); if(!inv) throw apiErr(404,{error:'Not found'}); ['description','amount','paidAmount','date'].forEach(k=>{ if(k in body) inv[k]=body[k]; }); saveDB(); return invoiceOut(inv); }
  if(seg[0]==='financial' && seg[1]==='invoices' && seg.length===3 && method==='DELETE'){ const i=DB.invoices.findIndex(x=>x.id===parseInt(seg[2])); if(i>=0){ DB.invoices.splice(i,1); saveDB(); } return {success:true}; }
  if(path==='/financial/summary'){ let billed=0,collected=0; DB.invoices.forEach(i=>{ billed+=Number(i.amount)||0; collected+=Number(i.paidAmount)||0; }); return {totalBilled:Math.round(billed*100)/100,totalCollected:Math.round(collected*100)/100,totalOutstanding:Math.round((billed-collected)*100)/100}; }

  if(path==='/reports/visits-per-day'){ const days=parseInt(query.days||'14'); const end=new Date(); const res=[]; for(let i=days-1;i>=0;i--){ const d=new Date(end); d.setDate(d.getDate()-i); const ds=isoDate(d); res.push({date:ds,visits:allAppointments().filter(a=>a.date===ds).length}); } return res; }
  if(path==='/reports/patient-summary'){ const now=Date.now(); const n30=DB.patients.filter(p=>p.createdAt&&(now-new Date(p.createdAt).getTime())<=30*864e5).length; return {totalPatients:DB.patients.length,totalAppointments:allAppointments().length,newPatientsLast30Days:n30}; }
  if(path==='/reports/visit-types'){ const m={}; allAppointments().forEach(a=>{ const k=a.visitType||'unspecified'; m[k]=(m[k]||0)+1; }); return Object.keys(m).map(k=>({visitType:k,count:m[k]})); }
  if(path==='/reports/revenue-by-status'){ const s={unpaid:0,partial:0,paid:0}; DB.invoices.forEach(i=>{ const st=i.paidAmount<=0?'unpaid':(i.paidAmount>=i.amount?'paid':'partial'); s[st]+=Number(i.amount)||0; }); return {unpaid:Math.round(s.unpaid*100)/100,partial:Math.round(s.partial*100)/100,paid:Math.round(s.paid*100)/100}; }
  if(path==='/reports/monthly'){
    let y=query.year?parseInt(query.year):null, mo=query.month?parseInt(query.month):null;
    if(!y||!mo){ const d=new Date(); d.setDate(1); d.setDate(0); y=d.getFullYear(); mo=d.getMonth()+1; }
    const prefix=y+'-'+pad2(mo);
    const appts=allAppointments().filter(a=>String(a.date||'').startsWith(prefix)&&a.status!=='cancelled');
    const invs=DB.invoices.filter(i=>String(i.date||'').startsWith(prefix));
    let billed=0,collected=0; invs.forEach(i=>{ billed+=Number(i.amount)||0; collected+=Number(i.paidAmount)||0; });
    return {year:y,month:mo,label:prefix,newVisits:appts.filter(a=>a.visitType==='consultation').length,followUps:appts.filter(a=>a.visitType==='followUp').length,totalVisits:appts.length,completedVisits:appts.filter(a=>a.status==='completed').length,moneyCollected:Math.round(collected*100)/100,totalBilled:Math.round(billed*100)/100,outstanding:Math.round((billed-collected)*100)/100,invoiceCount:invs.length};
  }

  if(path==='/settings/branding' && method==='GET') return clone(DB.branding);
  if(path==='/settings/branding' && method==='PUT'){ ['doctorNameEn','doctorNameAr','clinicNameEn','clinicNameAr','specialtyEn','specialtyAr','credentialsEn','credentialsAr','address1','address2','phone1','phone2','footerNoteAr'].forEach(k=>{ if(k in body) DB.branding[k]=body[k]; }); saveDB(); return clone(DB.branding); }
  if(path==='/settings/backup' && method==='GET'){
    return {exportedAt:new Date().toISOString(),branding:clone(DB.branding),
      patients:clone(DB.patients),
      appointments:allAppointments().map(a=>apptOut(a,true)),
      medicationRecords:clone(DB.medications),medicationLibrary:clone(DB.medLib),
      diagnosisLibrary:clone(DB.diagLib),prescriptions:clone(DB.prescriptions),
      doctorAvailability:[],invoices:DB.invoices.map(invoiceOut)};
  }

  throw apiErr(404,{error:'Not found: '+method+' '+path});
}

function _readFile(file){ return new Promise((resolve,reject)=>{ const r=new FileReader(); r.onload=()=>resolve(r.result); r.onerror=reject; r.readAsText(file); }); }
function _readDataUrl(file){ return new Promise((resolve,reject)=>{ const r=new FileReader(); r.onload=()=>resolve(r.result); r.onerror=reject; r.readAsDataURL(file); }); }
function _csvRows(text){
  const lines=text.replace(/\r/g,'').split('\n').filter(l=>l.trim().length);
  if(!lines.length) return [];
  const head=lines[0].split(',').map(h=>h.trim());
  return lines.slice(1).map(l=>{ const c=l.split(','); const o={}; head.forEach((h,i)=>o[h]=(c[i]||'').trim()); return o; });
}
function _rowVal(row,keys){ for(const k of keys){ for(const cand of [k,k.toLowerCase(),k.toUpperCase(),k.charAt(0).toUpperCase()+k.slice(1)]){ if(row[cand]!=null && String(row[cand]).trim()) return String(row[cand]).trim(); } } return ''; }

async function apiUpload(path, formData){
  if(path==='/files/upload'){
    const file=formData.get('file'); const patientId=parseInt(formData.get('patientId')); const appointmentId=formData.get('appointmentId')?parseInt(formData.get('appointmentId')):null; const category=formData.get('category')||'other';
    const dataUrl=await _readDataUrl(file);
    const rec={id:nextId(),patientId:patientId,appointmentId:appointmentId,category:category,fileName:file.name,originalName:file.name,fileType:(file.name.split('.').pop()||'').toLowerCase(),uploadDate:new Date().toISOString(),previewUrl:dataUrl,downloadUrl:dataUrl};
    const a=findAppt(appointmentId); if(a){ a.files=a.files||[]; a.files.push(rec); } saveDB();
    return clone(rec);
  }
  if(path==='/appointments/import'){
    const file=formData.get('file'); const text=(await _readFile(file)).replace(/^﻿/,'').trim(); let rows=[];
    if(text[0]==='['||text[0]==='{'){ let d=JSON.parse(text); if(!Array.isArray(d)) d=d.appointments||d.items||[]; rows=d.filter(r=>r&&typeof r==='object'); }
    else rows=_csvRows(text);
    let imported=0;
    rows.forEach(row=>{ const name=_rowVal(row,['name','patientName']); if(!name) return; const mobile=_rowVal(row,['mobile','mobileNumber','phone']); let vt=_rowVal(row,['visitType','type'])||'consultation'; if(!OFF_DUR[vt]) vt='consultation'; const r=resolveSlot(_rowVal(row,['date'])||null,_rowVal(row,['time'])||null,vt); if(!r.date||!r.time) return; const p=findOrCreatePatient(name,mobile); p.appointments.push(newAppt(p.id,{date:r.date,time:r.time,visitType:vt,status:'waiting'})); imported++; });
    saveDB(); return {imported:imported};
  }
  if(path==='/settings/import'){
    const file=formData.get('file'); const data=JSON.parse((await _readFile(file)).replace(/^﻿/,''));
    const counts={patients:0,appointments:0,prescriptions:0,invoices:0,medications:0}; const idMap={};
    (data.patients||[]).forEach(p=>{ const num=p.patientNumber; let ex=num?DB.patients.find(x=>x.patientNumber===num):null; if(ex){ idMap[p.id]=ex; return; } const np={id:nextId(),patientNumber:num||nextPatientNumber(),Name:p.Name||'Unknown',age:p.age,gender:p.gender,previousOperations:p.previousOperations,previousTreatment:p.previousTreatment,diagnosis:p.diagnosis,symptoms:p.symptoms,familyHistory:p.familyHistory,mobileNumber:p.mobileNumber,emergencyContact:p.emergencyContact,notes:p.notes,medicalHistoryExtra:p.medicalHistoryExtra||{},createdAt:new Date().toISOString(),appointments:[]}; (p.appointments||[]).forEach(a=>{ np.appointments.push(newAppt(np.id,a)); counts.appointments++; }); DB.patients.push(np); idMap[p.id]=np; counts.patients++; });
    (data.prescriptions||[]).forEach(rx=>{ const p=idMap[rx.patientId]; if(!p) return; DB.prescriptions.push({id:nextId(),patientId:p.id,date:rx.date,diagnosis:rx.diagnosis,notes:rx.notes,drugs:rx.drugs||[],createdAt:new Date().toISOString()}); counts.prescriptions++; });
    (data.invoices||[]).forEach(inv=>{ const p=idMap[inv.patientId]; if(!p) return; DB.invoices.push({id:nextId(),patientId:p.id,appointmentId:null,description:inv.description,amount:inv.amount||0,paidAmount:inv.paidAmount||0,date:inv.date}); counts.invoices++; });
    (data.medicationRecords||[]).forEach(m=>{ if(!m.name) return; DB.medications.push({id:nextId(),name:m.name,company:m.company,purpose:m.purpose,date:m.date,genericName:m.genericName,category:m.category,dosage:m.dosage}); counts.medications++; });
    (data.medicationLibrary||[]).forEach(m=>{ if(m.drugName && !DB.medLib.some(x=>(x.drugName||'').toLowerCase()===m.drugName.toLowerCase())) DB.medLib.push({drugName:m.drugName,genericName:m.genericName,dosage:m.dosage,category:m.category,notes:m.notes}); });
    (data.diagnosisLibrary||[]).forEach(d=>{ if(d.diagnosis && !DB.diagLib.some(x=>x.diagnosis===d.diagnosis)) DB.diagLib.push({code:d.code,diagnosis:d.diagnosis,description:d.description,specialty:d.specialty}); });
    saveDB(); return {imported:counts};
  }
  throw apiErr(404,{error:'Not found'});
}

let acTimer=null;
function runAutocomplete(inputEl,kind){
  clearTimeout(acTimer);
  const q=inputEl.value.trim();
  if(q.length<1){ hideAutocomplete(); return; }
  acTimer=setTimeout(async()=>{
    try{
      const path=kind==='diagnosis'?'/diagnosis/search'
        :kind==='medication'?'/medications/search'
        :kind==='labTest'?'/lab-tests/search'
        :'/radiology/search';
      const items=await apiGet(`${path}?q=${encodeURIComponent(q)}`);
      showAutocomplete(inputEl,kind,items);
    }catch(e){ hideAutocomplete(); }
  },250);
}
function showAutocomplete(inputEl,kind,items){
  const dd=document.getElementById('ac-dropdown');
  if(!items.length){ dd.style.display='none'; return; }
  const rect=inputEl.getBoundingClientRect();
  const width=Math.max(rect.width,300);
  dd.style.left=(rect.left+window.scrollX)+'px';
  dd.style.top=(rect.bottom+window.scrollY+4)+'px';
  dd.style.width=width+'px';
  dd.innerHTML=items.map((it,i)=>{
    let label;
    if(kind==='diagnosis') label=`${esc(it.diagnosis)}${it.code?` <small>${esc(it.code)}${it.specialty?' · '+esc(it.specialty):''}</small>`:''}`;
    else if(kind==='medication') label=`${esc(it.drugName)}${it.genericName||it.dosage||it.category?` <small>${esc([it.genericName,it.category,it.dosage].filter(Boolean).join(' · '))}</small>`:''}`;
    else if(kind==='labTest') label=`${esc(it.testName)}${it.code||it.category?` <small>${esc([it.code,it.category].filter(Boolean).join(' · '))}</small>`:''}`;
    else label=`${esc(it.examName)}${it.code||it.category?` <small>${esc([it.code,it.category].filter(Boolean).join(' · '))}</small>`:''}`;
    return `<div class="ac-item" data-i="${i}" onmousedown="event.preventDefault();pickAutocomplete(${i})">${label}</div>`;
  }).join('');
  dd._items=items; dd._inputEl=inputEl; dd._kind=kind; dd._active=-1;
  dd.style.display='block';
}
function hideAutocomplete(){
  const dd=document.getElementById('ac-dropdown');
  if(dd){ dd.style.display='none'; dd._active=-1; }
}
function pickAutocomplete(i){
  const dd=document.getElementById('ac-dropdown');
  const item=dd._items[i], inputEl=dd._inputEl, kind=dd._kind;
  hideAutocomplete();
  applyAutocompletePick(inputEl,kind,item);
}

function handleAcKeydown(event,inputEl){
  const dd=document.getElementById('ac-dropdown');
  if(!dd||dd.style.display==='none'||dd._inputEl!==inputEl) return;
  const items=dd.querySelectorAll('.ac-item');
  if(event.key==='ArrowDown'){
    event.preventDefault();
    dd._active=Math.min((dd._active??-1)+1,items.length-1);
  }else if(event.key==='ArrowUp'){
    event.preventDefault();
    dd._active=Math.max((dd._active??-1)-1,0);
  }else if(event.key==='Enter'){
    if(dd._active>=0&&dd._active<items.length){ event.preventDefault(); pickAutocomplete(dd._active); }
    return;
  }else if(event.key==='Escape'){
    hideAutocomplete();
    return;
  }else return;
  items.forEach((el,i)=>el.classList.toggle('ac-active',i===dd._active));
  const activeEl=items[dd._active];
  if(activeEl) activeEl.scrollIntoView({block:'nearest'});
}
function applyAutocompletePick(inputEl,kind,item){
  const ctx=JSON.parse(inputEl.dataset.acCtx||'{}');
  if(kind==='diagnosis'){
    inputEl.value=item.diagnosis;
    if(ctx.page==='appt') updateAppt(ctx.idx,'diagnosis',item.diagnosis);
    else if(ctx.page==='rxDiag'){ state.rxDiagnosis=item.diagnosis; refreshRxPreview(); }
  }else if(kind==='medication'){
    inputEl.value=item.drugName;
    if(ctx.page==='appt') updateAppt(ctx.idx,'drugs',item.drugName);
    else if(ctx.page==='rxDrug'){
      state.rxDrugs[ctx.idx].name=item.drugName;
      if(item.dosage && !state.rxDrugs[ctx.idx].dose) state.rxDrugs[ctx.idx].dose=item.dosage;
      renderPrescription();
    }
  }else if(kind==='labTest'){
    inputEl.value=item.testName;
    updateAppt(ctx.idx,'requiredTests',item.testName);
  }else if(kind==='radiology'){
    inputEl.value=item.examName;
    updateAppt(ctx.idx,'medicalXRayRequired',item.examName);
  }
  inputEl.focus();
}

async function loadInitialData(){
  const [patientsRes,medsRes]=await Promise.allSettled([
    apiGet('/patients?perPage=500'),
    apiGet('/medications'),
  ]);
  state.patients=patientsRes.status==='fulfilled'?patientsRes.value.items:[];
  state.medications=medsRes.status==='fulfilled'?medsRes.value:[];
  if(patientsRes.status==='rejected'||medsRes.status==='rejected'){
    toast('Some clinic data failed to load from the server.','error');
  }
}

function toast(msg, type='success'){
  const icons={
    success:`<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>`,
    error:`<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z"/></svg>`,
    info:`<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z"/></svg>`,
  };
  const el=document.createElement('div');
  el.className=`toast ${type}`;
  el.innerHTML=`<span class="toast-icon">${icons[type]}</span><span>${msg}</span>`;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(()=>el.remove(),3100);
}

let _cr=null;
function showConfirm(title,msg,okLabel){
  document.getElementById('conf-title').textContent=title;
  document.getElementById('conf-msg').textContent=msg;
  document.getElementById('conf-cancel').textContent=t('cancel');
  document.getElementById('conf-ok').textContent=okLabel||t('del');
  document.getElementById('confirm-overlay').style.display='flex';
  return new Promise(r=>{_cr=r;});
}
function resolveConfirm(v){
  document.getElementById('confirm-overlay').style.display='none';
  if(_cr){_cr(v);_cr=null;}
}

const ALL_PAGES=['signIn','home','patients','addPatient','medications','prescription','booking','financial','settings'];

function navigate(page){
  ALL_PAGES.forEach(p=>{
    const el=document.getElementById(`page-${p}`);
    if(el) el.style.display='none';
  });
  const navbar=document.getElementById('navbar');
  navbar.style.display = page==='signIn' ? 'none' : 'flex';

  buildNavLinks(page);

  state.currentPage=page;
  renderPage(page);
  document.getElementById(`page-${page}`).style.display='';
}

function buildNavLinks(activePage){
  document.getElementById('brand-el').textContent=t('brand');

  const pages=[
    {id:'home',        label:()=>t('home'),         icon:icoHome()},
    {id:'addPatient',  label:()=>t('addPatient'),   icon:icoAddPt()},
    {id:'booking',     label:()=>t('booking'),      icon:icoCalendar()},
    {id:'patients',    label:()=>t('patients'),     icon:icoDoctor()},
    {id:'prescription',label:()=>t('prescription'), icon:icoRx()},
    {id:'medications', label:()=>t('medications'),  icon:icoMed()},
    {id:'financial',   label:()=>t('financial'),    icon:icoFinancial()},
    {id:'settings',    label:()=>t('settings'),     icon:icoSettings()},
  ];
  document.getElementById('nav-links-el').innerHTML = pages.map(p=>`
    <button class="nav-btn ${activePage===p.id?'active':''}" onclick="${p.id==='addPatient'?'cancelEditPatient_silent();':''}navigate('${p.id}')">
      ${p.icon} ${p.label()}
    </button>`).join('');

  document.getElementById('globalSearch').placeholder=t('searchPh');
}

function renderPage(page){
  if(page==='signIn')       renderSignIn();
  else if(page==='home')        renderHome();
  else if(page==='patients')    renderPatients();
  else if(page==='addPatient')  renderAddPatient();
  else if(page==='medications') renderMedications();
  else if(page==='prescription')renderPrescription();
  else if(page==='booking')     renderBooking();
  else if(page==='financial')   renderFinancial();
  else if(page==='settings')    renderSettings();
}

function onSearch(val){
  state.searchQuery=val;
  if(state.currentPage==='patients') renderPatients();
  if(state.currentPage==='home') renderHome();
  if(state.currentPage==='medications') renderMedications();
  renderGlobalSearchDropdown(val);
}
function renderGlobalSearchDropdown(val){
  const dd=document.getElementById('global-search-dropdown');
  if(!dd) return;
  const q=(val||'').toLowerCase().trim();
  if(!q||state.currentPage==='signIn'){ dd.style.display='none'; return; }
  const matches=state.patients.filter(p=>
    (p.Name||'').toLowerCase().includes(q)||String(p.patientNumber||'').toLowerCase().includes(q)||String(p.mobileNumber||'').includes(q)
  ).slice(0,12);
  if(!matches.length){
    dd.innerHTML=`<div class="ac-item" style="cursor:default;color:#94a3b8;font-style:italic">${t('noPatients')}</div>`;
    dd.style.display='block'; return;
  }
  dd.innerHTML=matches.map(p=>{
    const idx=state.patients.indexOf(p);
    return `<div class="ac-item" onmousedown="event.preventDefault();openGlobalSearchResult(${idx})">
      <div style="font-weight:600">${esc(p.Name)}</div>
      <div style="font-size:0.72rem;color:#94a3b8">#${esc(p.patientNumber)} • ${esc(p.mobileNumber||'—')}</div>
    </div>`;
  }).join('');
  dd.style.display='block';
}
function openGlobalSearchResult(idx){
  closeGlobalSearch();
  const input=document.getElementById('globalSearch');
  if(input) input.value='';
  state.searchQuery='';
  openPatientDetail(idx);
}
function closeGlobalSearch(){
  const dd=document.getElementById('global-search-dropdown');
  if(dd) dd.style.display='none';
}

function filteredPatients(){
  const q=state.searchQuery.toLowerCase().trim();
  if(!q) return state.patients;
  return state.patients.filter(p=>p.Name.toLowerCase().includes(q)||String(p.patientNumber).includes(q)||String(p.mobileNumber||'').includes(q));
}
function filteredMedications(){
  const q=state.searchQuery.toLowerCase().trim();
  let list=!q?state.medications:state.medications.filter(m=>
    [m.name,m.company,m.genericName,m.category,m.dosage].some(v=>(v||'').toLowerCase().includes(q)));
  list=list.slice();
  if(state.medSort==='nameAsc') list.sort((a,b)=>a.name.localeCompare(b.name));
  else if(state.medSort==='nameDesc') list.sort((a,b)=>b.name.localeCompare(a.name));
  else if(state.medSort==='category') list.sort((a,b)=>(a.category||'').localeCompare(b.category||'')||a.name.localeCompare(b.name));
  else list.sort((a,b)=>b.id-a.id);
  return list;
}
function filteredInvoices(){
  const q=(state.financialSearch||'').toLowerCase().trim();
  if(!q) return state.invoiceList;
  return state.invoiceList.filter(inv=>
    (inv.patientName||'').toLowerCase().includes(q)||(inv.description||'').toLowerCase().includes(q));
}

function todayISO(){ return new Date().toISOString().split('T')[0]; }

async function fetchHomeQueue(){
  try{
    state.homeQueue=await apiGet(`/appointments?date=${todayISO()}`);
  }catch(err){ state.homeQueue=[]; }
  state.homeQueueLoaded=true;
  if(state.currentPage==='home'){ renderHome(); document.getElementById('page-home').style.display=''; }
}

function homeQueueOrder(list){
  return list.slice().sort((a,b)=>String(a.time||'').localeCompare(String(b.time||''))||a.id-b.id);
}

function patientIdxById(id){ return state.patients.findIndex(p=>p.id===id); }

function renderHome(){
  if(!state.homeQueueLoaded){
    document.getElementById('page-home').innerHTML=`<div class="page"><div class="page-heading">${t('homeTitle')}</div><p class="page-sub">${t('loading')}</p></div>`;
    fetchHomeQueue();
    return;
  }
  const all=homeQueueOrder(state.homeQueue);
  const active=all.filter(a=>a.status!=='cancelled');
  const waiting=active.filter(a=>a.status==='waiting'||a.status==='arrived');
  const completed=active.filter(a=>a.status==='completed');
  const current=active.find(a=>a.status==='in_consultation');
  const nextId=current?null:(waiting[0]?waiting[0].id:null);

  const rowsHTML=active.length===0
    ?`<tr><td colspan="9" style="text-align:center;color:#94a3b8;padding:2.2rem">${t('noBookingsToday')}</td></tr>`
    :active.map((a,i)=>{
      const isCurrent=a.status==='in_consultation';
      const isNext=a.id===nextId;
      const pIdx=patientIdxById(a.patientId);
      const rowBg=isCurrent?'background:rgba(37,99,235,.12)'
        :isNext?'background:rgba(22,163,74,.12)'
        :(i%2?'background:rgba(var(--accent-light-rgb),.07)':'background:transparent');
      const badge=isCurrent?`<span style="font-size:0.62rem;font-weight:800;color:#fff;background:#2563eb;padding:0.1rem 0.45rem;border-radius:999px;margin-inline-start:0.4rem">${t('inConsultationNow')}</span>`
        :isNext?`<span style="font-size:0.62rem;font-weight:800;color:#fff;background:#16a34a;padding:0.1rem 0.45rem;border-radius:999px;margin-inline-start:0.4rem">${t('nextTurn')}</span>`:'';
      const canStart=a.status==='waiting'||a.status==='arrived';
      return `

        <td>${i+1}</td>
        <td><span style="font-family:monospace;font-size:0.8rem;font-weight:700;color:var(--accent-deep);background:rgba(var(--accent-rgb),.10);padding:0.15rem 0.5rem;border-radius:6px">${esc(a.patientNumber||'—')}</span></td>
        <td><span style="font-weight:700;color:var(--accent-deep);cursor:pointer" ${pIdx>=0?`onclick="openPatientDetail(${pIdx})"`:''}>${esc(a.patientName||'—')}</span>${badge}</td>
        <td>${a.patientAge!=null&&a.patientAge!==''?esc(a.patientAge)+' '+t('yearsLabel'):'—'}</td>
        <td>${genderLabel(a.patientGender)}</td>
        <td style="white-space:nowrap">${formatBookingWhen(a.date,a.time)}</td>
        <td>${visitTypeLabel(a.visitType)}</td>
        <td><span style="font-weight:700;font-size:0.8rem;color:${statusColor(a.status)}">${statusLabel(a.status)}</span></td>
        <td>
          <div style="display:flex;gap:0.35rem;flex-wrap:wrap">
            ${a.status==='waiting'?`<button class="btn btn-ghost btn-sm" onclick="setHomeStatus(${a.id},'arrived')">${t('markArrived')}</button>`:''}
            ${canStart?`<button class="btn btn-primary btn-sm" onclick="setHomeStatus(${a.id},'in_consultation')">${t('startConsult')}</button>`:''}
            ${isCurrent?`<button class="btn btn-primary btn-sm" onclick="setHomeStatus(${a.id},'completed')">${t('markDone')}</button>`:''}
            ${a.status!=='completed'&&a.status!=='cancelled'?`<button class="btn btn-danger btn-sm" onclick="cancelHomeAppt(${a.id})">${t('cancelAppt')}</button>`:''}
          </div>
        </td>
      </tr>`;
    }).join('');

  const sessionDate=new Date().toLocaleDateString(currentLang==='ar'?'ar-EG':'en-GB',{day:'2-digit',month:'short',year:'numeric'});

  document.getElementById('page-home').innerHTML=`
  <div class="page">

function formatBookingWhen(dateISO,time){
  if(!dateISO) return '—';
  const dt=new Date(dateISO+'T00:00:00');
  const d=isNaN(dt)?dateISO:dt.toLocaleDateString(currentLang==='ar'?'ar-EG':'en-GB',{day:'2-digit',month:'short',year:'numeric'});
  return time?`${d} ${time}`:d;
}

async function setHomeStatus(id,status){
  try{
    await apiPut(`/appointments/${id}`,{status});
    await refreshQueuesAndPatients();
  }catch(err){ toast(err.message||'Failed to update status.','error'); }
}
async function cancelHomeAppt(id){
  const confirmed=await showConfirm(t('confirmDel'),t('confirmDelMsg'),t('cancelAppt'));
  if(!confirmed) return;
  try{
    await apiPut(`/appointments/${id}`,{status:'cancelled'});
    toast(t('apptCancelled'),'info');
    await refreshQueuesAndPatients();
  }catch(err){ toast(err.message||'Failed to cancel.','error'); }
}
async function refreshQueuesAndPatients(){
  try{
    const res=await apiGet('/patients?perPage=500');
    state.patients=res.items;
  }catch(err){}
  await fetchHomeQueue();
}

async function saveDetailAppointment(patientId){
  const payload={
    date:document.getElementById('da-date').value,
    visitType:document.getElementById('da-type').value,
    diagnosis:document.getElementById('da-diag').value,
    drugs:document.getElementById('da-drugs').value,
    requiredTests:document.getElementById('da-tests').value,
    visitNotes:document.getElementById('da-notes').value,
    status:'completed',
  };
  try{
    await apiPost(`/patients/${patientId}/appointments`,payload);
    toast(t('consultSaved'),'success');

    await refreshQueuesAndPatients();
    navigate('home');

async function uploadDetailFile(pIdx,aIdx,category,inputEl){
  const file=inputEl.files[0]; if(!file) return;
  if(!/\.(pdf|png|jpe?g)$/i.test(file.name)){ toast(t('invalidFileType'),'error'); inputEl.value=''; return; }
  const p=state.patients[pIdx]; const appt=p&&p.appointments&&p.appointments[aIdx];
  if(!appt) return;
  try{
    const rec=await uploadApptFile(p.id,appt.id,category,file);
    appt.files=appt.files||[];
    appt.files.push(rec);
    toast(t('fileUploaded'),'success');
    openPatientDetail(pIdx);
  }catch(err){
    toast(err.message||t('fileUploadFailed'),'error');
  }
}

async function savePatient(event,forceCreateDuplicate){
  event.preventDefault();
  const formData=new FormData(event.target);
  const payload={
    Name:formData.get('name'), patientNumber:formData.get('patientNumber'),
    age:formData.get('age'), gender:formData.get('gender'),
    previousOperations:formData.get('previousOperations'),
    previousTreatment:formData.get('previousTreatment'),
    diagnosis:formData.get('diagnosis'), symptoms:formData.get('symptoms'),
    familyHistory:formData.get('familyHistory'),
    
    mobileNumber:formData.get('mobileNumber'),
    notes:formData.get('notes'),
    
    medicalHistoryExtra:state.medicalHistoryExtra,
    
    appointments:state.appointments.map(({isEditing,testsResultFile,medicalXRayResultFile,...a})=>a),
  };
  
  if(state.editingPatientId!=null){
    try{
      delete payload.patientNumber; delete payload.appointments;
      const updated=await apiPut(`/patients/${state.editingPatientId}`,payload);
      const idx=state.patients.findIndex(p=>p.id===state.editingPatientId);
      if(idx!==-1) state.patients[idx]={...state.patients[idx],...updated};
      state.editingPatientId=null;
      state.medicalHistoryExtra={};
      toast(t('patientUpdated'),'success');
      navigate('home');
    }catch(err){
      toast(err.message||t('fillFields'),'error');
    }
    return;
  }
  if(forceCreateDuplicate) payload.forceCreateDuplicate=true;
  
  delete payload.patientNumber;
  try{
    const pendingAppts=state.appointments;
    const patient=await apiPost('/patients',payload);
    state.patients.unshift(patient);
    await uploadPendingApptFiles(patient,pendingAppts);
    state.appointments=[];
    state.nextPatientNumber=null;
    state.medicalHistoryExtra={};
    event.target.reset();
    toast(t('patSaved'),'success');
    navigate('home');
  }catch(err){
    
    if(err.status===409){
      const existing=err.data.existingPatient;
      const proceed=await showConfirm(t('dupTitle'),`${t('dupMsg')} ${existing.Name} (#${existing.patientNumber})`,t('savePatient'));
      if(proceed) return savePatient(event,true);
    }else{
      toast(err.message||t('fillFields'),'error');
    }
  }
}

function setApptFile(i,key,inputEl){
  const file=inputEl.files[0];
  if(file && !/\.(pdf|png|jpe?g)$/i.test(file.name)){
    toast(t('invalidFileType'),'error');
    inputEl.value='';
    return;
  }
  state.appointments[i][key]=file||null;
  renderAddPatient();
  document.getElementById('page-addPatient').style.display='';
}
async function uploadPendingApptFiles(patient,pendingAppts){
  const jobs=[];
  pendingAppts.forEach((a,i)=>{
    const apptId=patient.appointments&&patient.appointments[i]&&patient.appointments[i].id;
    if(!apptId) return;
    if(a.testsResultFile) jobs.push(uploadApptFile(patient.id,apptId,'test_result',a.testsResultFile)
      .then(f=>patient.appointments[i].files.push(f)));
    if(a.medicalXRayResultFile) jobs.push(uploadApptFile(patient.id,apptId,'xray_result',a.medicalXRayResultFile)
      .then(f=>patient.appointments[i].files.push(f)));
  });
  if(!jobs.length) return;
  const results=await Promise.allSettled(jobs);
  if(results.some(r=>r.status==='rejected')) toast(t('fileUploadFailed'),'error');
}

function onRxPatientSearch(value){
  state.rxPatientQuery=value;
  state.rxPatient=null;
  renderRxPtDropdown(value);
}
function highlightMatch(text,q){
  const s=esc(text||'');
  if(!q) return s;
  const idx=s.toLowerCase().indexOf(q.toLowerCase());
  if(idx===-1) return s;
  return s.slice(0,idx)+'<mark style="background:#fde68a;color:inherit;border-radius:2px">'+s.slice(idx,idx+q.length)+'</mark>'+s.slice(idx+q.length);
}
function getRecentPatientIds(){
  try{ return JSON.parse(localStorage.getItem('rxRecentPatients')||'[]'); }catch(e){ return []; }
}
function addRecentPatientId(id){
  let ids=getRecentPatientIds().filter(x=>x!==id);
  ids.unshift(id);
  localStorage.setItem('rxRecentPatients',JSON.stringify(ids.slice(0,5)));
}
function renderRxPtDropdown(query){
  const dd=document.getElementById('rx-pt-dropdown');
  if(!dd) return;
  const q=(query||'').toLowerCase().trim();
  let list, sectionLabel=null;
  if(!q){
    const recentIds=getRecentPatientIds();
    list=recentIds.map(id=>state.patients.findIndex(p=>p.id===id)).filter(idx=>idx>=0).map(idx=>({idx,p:state.patients[idx]}));
    if(list.length) sectionLabel=t('recentPatients');
  }else{
    list=state.patients.map((p,idx)=>({idx,p})).filter(({p})=>
      p.Name.toLowerCase().includes(q)||String(p.mobileNumber||'').includes(q)||String(p.patientNumber||'').toLowerCase().includes(q)
    ).slice(0,20);
  }
  if(!list.length){
    dd.innerHTML=`<div class="ac-item" style="cursor:default;color:#94a3b8;font-style:italic">${t('noPtMatch')}</div>`;
    dd.style.display='block'; dd._active=-1;
    return;
  }
  dd.innerHTML=(sectionLabel?`<div style="padding:.4rem .8rem;font-size:.68rem;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.04em">${sectionLabel}</div>`:'')+
    list.map(({idx,p},i)=>`
      <div class="ac-item" data-i="${i}" data-idx="${idx}" onmousedown="selectRxPatient(${idx})">
        <div style="font-weight:600">${highlightMatch(p.Name,q)}</div>
        <div style="font-size:0.72rem;color:#94a3b8">#${highlightMatch(p.patientNumber,q)} • ${highlightMatch(p.mobileNumber||'',q)}</div>
      </div>`).join('');
  dd.style.display='block';
  dd._active=-1;
}
function handleRxPtKeydown(event){
  const dd=document.getElementById('rx-pt-dropdown');
  if(!dd||dd.style.display==='none') return;
  const items=dd.querySelectorAll('.ac-item[data-idx]');
  if(event.key==='ArrowDown'){
    event.preventDefault();
    dd._active=Math.min((dd._active??-1)+1,items.length-1);
  }else if(event.key==='ArrowUp'){
    event.preventDefault();
    dd._active=Math.max((dd._active??-1)-1,0);
  }else if(event.key==='Enter'){
    if(dd._active>=0&&dd._active<items.length){
      event.preventDefault();
      selectRxPatient(parseInt(items[dd._active].dataset.idx));
    }
    return;
  }else if(event.key==='Escape'){
    closeRxPtDropdown();
    return;
  }else return;
  items.forEach((el,i)=>el.classList.toggle('ac-active',i===dd._active));
  const activeEl=items[dd._active];
  if(activeEl) activeEl.scrollIntoView({block:'nearest'});
}
function closeRxPtDropdown(){
  const dd=document.getElementById('rx-pt-dropdown');
  if(dd){ dd.style.display='none'; dd._active=-1; }
}
function selectRxPatient(idx){
  state.rxPatient=idx;
  state.rxPatientQuery='';
  const p=state.patients[idx];
  if(p){
    if(p.id) addRecentPatientId(p.id);
    autofillPrescriptionFromPatient(p);
  }
  closeRxPtDropdown();
  renderPrescription();
  document.getElementById('page-prescription').style.display='';
}
function autofillPrescriptionFromPatient(p){
  const appts=(p.appointments||[]).slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))||b.id-a.id);
  const latest=appts[0];
  state.rxDiagnosis=(latest&&latest.diagnosis)||p.diagnosis||'';
  const noteParts=[];
  if(p.symptoms) noteParts.push(p.symptoms);
  if(p.notes) noteParts.push(p.notes);
  if(latest&&latest.visitNotes) noteParts.push(latest.visitNotes);
  state.rxNotes=noteParts.join(' — ');
  const drugSource=(latest&&latest.drugs)||'';
  state.rxDrugs=drugSource
    ? drugSource.split(/[,\n؛;]+/).map(s=>s.trim()).filter(Boolean).map(name=>({name,dose:''}))
    : [];
}
function refreshRxPreview(){
  const rxPt=state.rxPatient!=null?state.patients[state.rxPatient]:null;
  const el=document.getElementById('rx-preview-wrap');
  if(el) el.innerHTML=buildRxPreview(rxPt);
}

function setRxPrintMode(mode){
  state.rxPrintMode=mode;
  localStorage.setItem('rxPrintMode',mode);
  renderPrescription();
  document.getElementById('page-prescription').style.display='';
}
function addRxDrug(){ state.rxDrugs.push({name:'',dose:''}); renderPrescription(); document.getElementById('page-prescription').style.display=''; }
function removeRxDrug(i){ state.rxDrugs.splice(i,1); renderPrescription(); document.getElementById('page-prescription').style.display=''; }
function clearRx(){ state.rxDrugs=[]; state.rxPatient=null; state.rxDiagnosis=''; state.rxNotes=''; state.rxDate=null; renderPrescription(); document.getElementById('page-prescription').style.display=''; }

async function printPrescription(){
  const rxPt=state.rxPatient!=null?state.patients[state.rxPatient]:null;
  
  if(rxPt&&rxPt.id){
    const date=document.getElementById('rx-date')?document.getElementById('rx-date').value:undefined;
    apiPost('/prescriptions',{
      patientId:rxPt.id, date, diagnosis:state.rxDiagnosis,
      drugs:state.rxDrugs.filter(d=>d.name.trim()), notes:state.rxNotes,
    }).catch(err=>console.error('Failed to save prescription history:',err));
  }
  
  state.rxDrugs.filter(d=>d.name.trim()).forEach(d=>ensureMedicationInLibrary(d.name.trim(),d.dose.trim()));
  const content=buildRxPreview(rxPt);
  openRxPrintWindow(content);
}

async function ensureMedicationInLibrary(name,dose){
  try{
    const matches=await apiGet(`/medications/search?q=${encodeURIComponent(name)}`);
    if(matches.some(m=>(m.drugName||'').toLowerCase()===name.toLowerCase())) return;
    await apiPost('/medications/library',{drugName:name,dosage:dose||undefined});
  }catch(err){ console.error('Failed to auto-save new medication:',err); }
}

}

const VISIT_TYPES=['consultation','followUp'];
const VISIT_TYPE_DURATIONS={consultation:15,followUp:10};
function visitTypeLabel(vt){
  const map={consultation:t('visitTypeConsult'),followUp:t('visitTypeFollowUp')};
  return map[vt]||vt||'—';
}
function visitTypeLabelWithDuration(vt){
  const mins=VISIT_TYPE_DURATIONS[vt];
  return mins?`${visitTypeLabel(vt)} (${mins} ${t('minutesAbbrev')})`:visitTypeLabel(vt);
}
function statusLabel(s){
  const map={waiting:t('statusWaiting'),arrived:t('statusArrived'),in_consultation:t('statusInConsultation'),completed:t('statusCompleted'),cancelled:t('statusCancelled')};
  return map[s]||s;
}
function statusColor(s){
  const map={waiting:'#d97706',arrived:'#7c3aed',in_consultation:'#2563eb',completed:'#16a34a',cancelled:'#dc2626'};
  return map[s]||'#64748b';
}
function formatDayLabel(iso){
  if(!iso) return '';
  const dt=new Date(iso+'T00:00:00');
  return dt.toLocaleDateString(currentLang==='ar'?'ar-EG':'en-US',{weekday:'long',day:'numeric',month:'short'});
}

async function initBooking(){
  try{
    const meta=await apiGet(`/appointments/slots?visitType=${state.bookingVisitType}`);
    state.bookingValidDays=meta.validDays||[];
    if(!state.bookingDay||!state.bookingValidDays.includes(state.bookingDay))
      state.bookingDay=state.bookingValidDays[0]||'';
  }catch(e){ state.bookingValidDays=[]; }
  state.bookingLoaded=true;
  await loadBookingDay();
}
async function loadBookingDay(){
  try{
    const meta=await apiGet(`/appointments/slots?date=${state.bookingDay}&visitType=${state.bookingVisitType}`);
    state.bookingSlots=meta.slots||[];
  }catch(e){ state.bookingSlots=[]; }
  try{
    state.bookingList=state.bookingDay?await apiGet(`/appointments?date=${state.bookingDay}`):[];
  }catch(e){ state.bookingList=[]; }
  renderBooking();
  document.getElementById('page-booking').style.display='';
}

function bookingListRows(){
  const q=(state.bookingSearch||'').toLowerCase().trim();
  let list=state.bookingList.filter(a=>a.status!=='cancelled');
  if(q) list=list.filter(a=>(a.patientName||'').toLowerCase().includes(q)||String(a.patientNumber||'').toLowerCase().includes(q)||String(a.patientMobile||'').includes(q));
  list=list.slice().sort((a,b)=>String(a.time||'').localeCompare(String(b.time||'')));
  if(!list.length) return `<tr><td colspan="5" style="text-align:center;color:#94a3b8;padding:2rem">${t('noApptsFound')}</td></tr>`;
  return list.map(a=>`
    <tr>
      <td>${esc(a.patientName||'—')}<div style="font-size:0.72rem;color:#94a3b8">#${esc(a.patientNumber||'')}${a.patientMobile?' · '+esc(a.patientMobile):''}</div></td>
      <td>${esc(a.time||'—')}</td>
      <td>${visitTypeLabel(a.visitType)}</td>
      <td><span style="font-weight:700;font-size:0.78rem;color:${statusColor(a.status)}">${statusLabel(a.status)}</span></td>
      <td><button class="btn btn-danger btn-sm" onclick="cancelBookingAppt(${a.id})">${t('cancelAppt')}</button></td>
    </tr>`).join('');
}
function setBookingSearch(val){
  state.bookingSearch=val;
  const tbody=document.getElementById('bk-rows-tbody');
  if(tbody) tbody.innerHTML=bookingListRows();
}

          <select class="form-input" id="bk-type" onchange="onBookingTypeChange(this.value)">

function onBookingTypeChange(v){ state.bookingVisitType=v; loadBookingDay(); }
function onBookingDayChange(v){ state.bookingDay=v; loadBookingDay(); }

async function bookWalkin(){
  const name=document.getElementById('bk-name').value.trim();
  const mobile=document.getElementById('bk-phone').value.trim();
  const visitType=document.getElementById('bk-type').value;
  const timeSel=document.getElementById('bk-time').value;
  if(!name){ toast(t('fillFields'),'error'); return; }
  const body={name,mobileNumber:mobile,visitType};
  if(timeSel==='__nearest__'){ body.nearest=true; }
  else{ body.date=state.bookingDay; body.time=timeSel; }
  try{
    const res=await apiPost('/appointments/book',body);
    toast(`${t('apptBooked')} — ${esc(formatDayLabel(res.date))} ${res.time}`,'success');
    if(res.date&&state.bookingValidDays.includes(res.date)) state.bookingDay=res.date;
    document.getElementById('bk-name').value='';
    document.getElementById('bk-phone').value='';
    await refreshAfterBooking();
  }catch(err){ toast(err.message||t('fillFields'),'error'); }
}

async function importAppointmentsFile(inputEl){
  const file=inputEl.files[0]; if(!file) return;
  const fd=new FormData(); fd.append('file',file);
  try{
    const res=await apiUpload('/appointments/import',fd);
    toast(`${res.imported} ${t('importedCount')}`,'success');
    await refreshAfterBooking();
  }catch(err){ toast(err.message||t('fileUploadFailed'),'error'); }
  inputEl.value='';
}

async function cancelBookingAppt(id){
  const confirmed=await showConfirm(t('confirmDel'),t('confirmDelMsg'),t('cancelAppt'));
  if(!confirmed) return;
  try{
    await apiPut(`/appointments/${id}`,{status:'cancelled'});
    toast(t('apptCancelled'),'info');
    await refreshAfterBooking();
  }catch(err){ toast(err.message||'Failed to cancel.','error'); }
}

async function refreshAfterBooking(){
  try{ state.patients=(await apiGet('/patients?perPage=500')).items; }catch(e){}
  await loadBookingDay();
  if(state.homeQueueLoaded){ try{ state.homeQueue=await apiGet(`/appointments?date=${todayISO()}`); }catch(e){} }
}

async function addMedication(){
  const name=document.getElementById('med-name').value.trim();
  const company=document.getElementById('med-company').value.trim();
  const purpose=document.getElementById('med-purpose').value.trim();
  const genericName=document.getElementById('med-generic').value.trim();
  const category=document.getElementById('med-category').value.trim();
  const dosage=document.getElementById('med-dosage').value.trim();
  if(!name||!company||!purpose){ toast(t('fillFields'),'error'); return; }
  try{
    const record=await apiPost('/medications',{name,company,purpose,genericName,category,dosage});
    state.medications.unshift(record);
    toast(t('medAdded'),'success');
    renderMedications();
    document.getElementById('page-medications').style.display='';
  }catch(err){ toast(err.message||'Failed to add medication.','error'); }
}
async function removeMedication(i){
  const confirmed=await showConfirm(t('confirmDel'),t('confirmDelMsg'));
  if(!confirmed) return;
  const record=state.medications[i];
  try{
    await apiDelete(`/medications/${record.id}`);
    state.medications.splice(i,1);
    toast(t('medDeleted'),'info');
    renderMedications();
    document.getElementById('page-medications').style.display='';
  }catch(err){ toast(err.message||'Failed to delete medication.','error'); }
}

async function downloadBackup(){
  try{
    const data=await apiGet('/settings/backup');
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=`clinic-backup-${new Date().toISOString().split('T')[0]}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }catch(err){ toast(err.message||'Failed to download backup.','error'); }
}

async function importData(inputEl){
  const file=inputEl.files[0]; if(!file) return;
  const fd=new FormData(); fd.append('file',file);
  try{
    await apiUpload('/settings/import',fd);
    toast(t('importDone'),'success');
    await loadInitialData();
  }catch(err){ toast(err.message||'Failed to import data.','error'); }
  inputEl.value='';
}

        <p style="color:#777;font-size:.9rem;margin:0;">See README.md, "Set up and run the backend", for full setup steps.</p>
      </div>
    </div>`;
  return true;
}
const AUTH_KEY='clinicAuthed';
function markAuthenticated(){ sessionStorage.setItem(AUTH_KEY,'1'); }
function isAuthenticated(){ return sessionStorage.getItem(AUTH_KEY)==='1'; }

let liveSyncTimer=null;
function startLiveSync(){
  if(liveSyncTimer) clearInterval(liveSyncTimer);
  liveSyncTimer=setInterval(liveSyncTick,60000);
}
async function liveSyncTick(){
  if(!isAuthenticated()||state.currentPage==='signIn') return;
  try{
    const res=await apiGet('/patients?perPage=500');
    state.patients=res.items;
  }catch(err){ return; }
  if(state.currentPage==='home'){ await fetchHomeQueue(); }
  else if(state.currentPage==='patients'){ renderPatients(); }
  else if(state.currentPage==='booking'&&state.bookingLoaded){ await loadBookingDay(); }
}

async function bootApp(){
  applyTheme(localStorage.getItem(THEME_STORAGE_KEY) || 'ocean');
  if(checkRuntimeEnvironment()) return;
  startLiveSync();
  if(isAuthenticated()){
    await loadInitialData();
    navigate('home');
  }else{
    navigate('signIn');
  }
}
bootApp();
</script>
